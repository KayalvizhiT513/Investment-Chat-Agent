<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Analytics AI Agent</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            color: #212121;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #dee2e6;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 85vh;
            max-height: 800px;
        }
        
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 12px;
            line-height: 1.6;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.assistant {
            align-self: flex-start;
            background: #e3f2fd;
            border: 1px solid #bbdefb;
            border-left: 3px solid #1976d2;
            color: #212121;
        }
        
        .message.user {
            align-self: flex-end;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-right: 3px solid #616161;
            color: #212121;
        }
        
        .message ul {
            margin-top: 12px;
            padding-left: 20px;
        }
        
        .message li {
            margin-bottom: 6px;
            color: #424242;
        }
        
        .message.thinking {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #757575;
        }
        
        .dots {
            display: flex;
            gap: 4px;
        }
        
        .dots span {
            width: 6px;
            height: 6px;
            background: #1976d2;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        
        .dots span:nth-child(1) { animation-delay: 0s; }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
            40% { transform: translateY(-8px); opacity: 1; }
        }
        
        .input-area {
            padding: 20px 28px;
            background: #fafafa;
            border-top: 1px solid #dee2e6;
        }
        
        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        
        textarea {
            flex: 1;
            background: #ffffff;
            border: 1px solid #ced4da;
            border-radius: 12px;
            padding: 14px 16px;
            color: #212121;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }
        
        textarea:focus {
            border-color: #1976d2;
        }
        
        textarea::placeholder {
            color: #9e9e9e;
        }
        
        button {
            padding: 14px 28px;
            background: #1976d2;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        
        button:hover {
            background: #1565c0;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(25, 118, 210, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .callout {
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 8px;
            font-size: 13px;
        }
        
        .callout.warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
        }
        
        .callout.info {
            background: #e3f2fd;
            border: 1px solid #1976d2;
            color: #0d47a1;
        }
        
        .callout-title {
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }
        
        .callout ul {
            margin-top: 8px;
            padding-left: 18px;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f5f5f5;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #bdbdbd;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #9e9e9e;
        }
        
        @media (max-width: 768px) {
            .container {
                height: 100vh;
                max-height: none;
                border-radius: 0;
            }
            
            .message {
                max-width: 90%;
            }
            
            .input-wrapper {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="chat-area" id="chat-messages">
        </div>
        
        <div class="input-area">
            <div class="input-wrapper">
                <textarea 
                    id="message-input" 
                    rows="2" 
                    placeholder="Ask about portfolio metrics, e.g., 'Calculate volatility for Growth Plus from 2023-01-31 to 2023-12-31'"
                    onkeydown="handleKeyPress(event)"
                ></textarea>
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
    
    <script>
        const chatMessages = document.getElementById("chat-messages");
        const messageInput = document.getElementById("message-input");
        let conversationHistory = [];

        function escapeHTML(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function parseContent(content, parameters) {
            let html = "";

            // Handle missing parameters
            if (content.includes("I need the following information")) {
                const parts = content.split(".");
                html += '<div class="callout warning">';
                html += '<div class="callout-title">Missing Information</div>';
                html += '<p>' + escapeHTML(parts[0]) + '</p>';
                if (parts.length > 1) {
                    html += '<p style="margin-top: 8px;">' + escapeHTML(parts.slice(1).join(".")) + '</p>';
                }
                html += '</div>';
            } else {
                // Regular content
                html += escapeHTML(content).replace(/\n/g, '<br>');
            }

            // Include parameters if available and not empty
            if (parameters && Object.keys(parameters).length > 0) {
                const nonEmptyParams = Object.entries(parameters).filter(([_, value]) => value !== null && value !== "");
                if (nonEmptyParams.length > 0) {
                    html += '<div class="callout info">';
                    html += '<div class="callout-title">Extracted Parameters</div>';
                    html += '<ul>';
                    for (const [key, value] of nonEmptyParams) {
                        html += `<li><strong>${escapeHTML(key)}:</strong> ${escapeHTML(value)}</li>`;
                    }
                    html += '</ul>';
                    html += '</div>';
                }
            }

            return html;
        }

        function addMessage(content, sender, parameters = null) {
            const messageDiv = document.createElement("div");
            messageDiv.className = "message " + sender;
            messageDiv.innerHTML = parseContent(content, parameters);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            addMessage(message, "user");
            conversationHistory.push({ role: "user", content: message });
            messageInput.value = "";

            // Show thinking indicator
            const thinkingDiv = document.createElement("div");
            thinkingDiv.className = "message assistant thinking";
            thinkingDiv.innerHTML = '<div class="dots"><span></span><span></span><span></span></div><span>Processing your request...</span>';
            chatMessages.appendChild(thinkingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: message,
                        conversation_history: conversationHistory
                    })
                });

                const thinking = chatMessages.querySelector(".message.thinking");
                if (thinking) thinking.remove();

                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }

                const data = await response.json();
                addMessage(data.response, "assistant", data.parameters);

                if (data.reset_history) {
                    conversationHistory = [];
                } else {
                    conversationHistory.push({ role: "assistant", content: data.response });
                }
            } catch (error) {
                const thinking = chatMessages.querySelector(".message.thinking");
                if (thinking) thinking.remove();
                addMessage("Sorry, there was an error processing your request. Please try again.", "assistant");
                console.error("Error:", error);
            }
        }

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });
    </script>
</body>
</html>
